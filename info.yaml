# Tiny Tapeout project information
project:
  title:        "Kraken-X Protocol Emulator"      # Project title
  author:       "Matthias Musch"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Protocol emulator"      # One line description of what your project does
  # Hardening uses a Yosys-friendly Verilog bundle. Edit the .sv sources and run
  # `scripts/gen_tt_verilog.sh` (see docs/ai/tt_host_link.md). Cocotb still sims the .sv.
  language:     "Verilog"
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kraken_x_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_bundle.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs — gpio[21:15] input only, plus the host clock
  ui[0]: "gpio15"
  ui[1]: "gpio16"
  ui[2]: "gpio17"
  ui[3]: "gpio18"
  ui[4]: "gpio19"
  ui[5]: "gpio20"
  ui[6]: "gpio21"
  ui[7]: "host SCK"

  # Outputs — gpio[14:7] output only
  uo[0]: "gpio7"
  uo[1]: "gpio8"
  uo[2]: "gpio9"
  uo[3]: "gpio10"
  uo[4]: "gpio11"
  uo[5]: "gpio12"
  uo[6]: "gpio13"
  uo[7]: "gpio14"

  # Bidirectional — gpio[6:0] driven with gpio_oe, plus the host data line
  uio[0]: "gpio0"
  uio[1]: "gpio1"
  uio[2]: "gpio2"
  uio[3]: "gpio3"
  uio[4]: "gpio4"
  uio[5]: "gpio5"
  uio[6]: "gpio6"
  uio[7]: "host SDIO"

# Do not change!
yaml_version: 6
