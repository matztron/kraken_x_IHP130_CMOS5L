# Tiny Tapeout project information
project:
  title:        "Kraken-X Protocol Emulator"      # Project title
  author:       "Matthias Musch"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Protocol emulator"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kraken_x_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "kraken_pkg.sv"
    - "kraken_imem.sv"
    - "kraken_decode.sv"
    - "kraken_alu.sv"
    - "kraken_regfile.sv"
    - "kraken_pc.sv"
    - "kraken_pins.sv"
    - "kraken_fifo.sv"
    - "kraken_clkdiv.sv"
    - "kraken_sm.sv"
    - "kraken_pio.sv"
    - "kraken_io.sv"
    - "kraken_axil.sv"
    - "kraken_tt_host.sv"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs — host write-data byte
  ui[0]: "host_d0"
  ui[1]: "host_d1"
  ui[2]: "host_d2"
  ui[3]: "host_d3"
  ui[4]: "host_d4"
  ui[5]: "host_d5"
  ui[6]: "host_d6"
  ui[7]: "host_d7"

  # Outputs — PIO gpio_out[7:0]
  uo[0]: "gpio0"
  uo[1]: "gpio1"
  uo[2]: "gpio2"
  uo[3]: "gpio3"
  uo[4]: "gpio4"
  uo[5]: "gpio5"
  uo[6]: "gpio6"
  uo[7]: "gpio7"

  # Bidirectional pins. oe is 0: strobe/opcode/gpio_in are inputs.
  # uio_out carries the CSR read byte for simulation; it is not driven on the pad.
  uio[0]: "host_stb"
  uio[1]: "host_op0"
  uio[2]: "host_op1"
  uio[3]: "host_op2"
  uio[4]: "gpio_in0"
  uio[5]: "gpio_in1"
  uio[6]: "gpio_in2"
  uio[7]: "gpio_in3"

# Do not change!
yaml_version: 6
