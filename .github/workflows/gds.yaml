name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Yosys's SV frontend cannot parse our packages (`return`, `import`, …).
      # Regenerate the committed Verilog bundle so hardening always matches .sv.
      - name: Install sv2v
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sv2v.zip \
            "https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip"
          sudo unzip -o /tmp/sv2v.zip -d /tmp
          sudo install -m 755 /tmp/sv2v-Linux/sv2v /usr/local/bin/sv2v
          sv2v --version

      - name: Generate tt_bundle.v for Yosys
        run: ./scripts/gen_tt_verilog.sh

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b
